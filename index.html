<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WOLF LABS | The Mind Palace 2.0</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgBase: '#020617',       
                        panelDark: '#0F172A',    
                        panelHover: '#1E293B',   
                        textMain: '#F8FAFC',     
                        textMuted: '#94A3B8',    
                        accentViolet: '#8B5CF6', 
                        accentMint: '#10B981',   
                        accentPink: '#F43F5E'    
                    },
                    fontFamily: {
                        epic: ['Outfit', 'sans-serif'],
                        ui: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #020617; color: #F8FAFC; overflow: hidden; font-family: 'Inter', sans-serif; 
            transition: background-color 1s ease; 
            background-image: radial-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        body.immersive-shift { background-color: #1A0B2E; }
        body.immersive-shift .ws-panel { border-color: rgba(139, 92, 246, 0.4); box-shadow: 0 10px 40px rgba(139, 92, 246, 0.2); }
        
        .ws-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(139, 92, 246, 0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .glow-violet { text-shadow: 0 0 15px rgba(139, 92, 246, 0.6); }
        .glow-mint { text-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 10px; }

        @keyframes fadeOut { to { opacity: 0; pointer-events: none; } }
        .fade-out { animation: fadeOut 0.8s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes damageShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-15px); } 40%, 80% { transform: translateX(15px); } }
        .damage-shake { animation: damageShake 0.4s ease-in-out; }
        @keyframes slideDown { 0% { transform: translateY(-100%); opacity: 0; } 10%, 90% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100%); opacity: 0; } }
        .praise-slide { animation: slideDown 3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .teacher-drawer { position: fixed; top: 0; right: -400px; width: 400px; height: 100vh; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px); z-index: 200; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-left: 1px solid #8B5CF6; box-shadow: -10px 0 30px rgba(0,0,0,0.8); }
        .teacher-drawer.open { right: 0; }

        .lever-track { width: 140px; height: 48px; background: #0F172A; border-radius: 24px; position: relative; cursor: pointer; border: 2px solid #1E293B; }
        .lever-thumb { width: 56px; height: 40px; background: #94A3B8; border-radius: 20px; position: absolute; top: 2px; left: 4px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .lever-track.toggled .lever-thumb { left: 76px; background: #8B5CF6; box-shadow: 0 0 15px rgba(139, 92, 246, 0.6); }

        .progress-bar-fill { transition: width 0.3s ease; }
        .chart-bar-fill { transition: width 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .btn-neuro { 
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(139, 92, 246, 0.05));
            color: #8B5CF6; border: 1px solid #8B5CF6; font-family: 'Outfit', sans-serif; 
            text-transform: uppercase; font-weight: 800; letter-spacing: 0.1em; transition: all 0.3s; 
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.1) inset;
        }
        .btn-neuro:hover { background: #8B5CF6; color: #020617; box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }

        .drop-area { min-height: 100px; transition: background 0.2s; }
        .match-item { cursor: pointer; user-select: none; }
    </style>
</head>
<body class="flex flex-col h-screen select-none relative">
    
    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="fixed inset-0 z-[1000] bg-bgBase flex flex-col items-center justify-center">
        <div class="text-accentViolet text-7xl mb-8 animate-pulse"><i class="fa-solid fa-brain glow-violet"></i></div>
        <h1 class="font-epic text-6xl text-textMain tracking-[0.2em] mb-2 uppercase">SYNAPSE LINK</h1>
        <p class="font-mono text-accentMint tracking-[0.3em] mb-12 font-bold uppercase text-xs glow-mint">B2 Cognitive Division</p>
        <button onclick="initializeSystem()" class="btn-neuro px-16 py-4 rounded-full text-xl">ENTER THE PALACE</button>
    </div>

    <!-- DAMAGE OVERLAY -->
    <div id="damage-overlay" class="fixed inset-0 z-[800] bg-accentPink/10 border-8 border-accentPink/40 opacity-0 pointer-events-none transition-opacity duration-100 flex items-center justify-center">
        <div class="font-epic text-9xl text-accentPink opacity-30 tracking-widest">COGNITIVE ERROR</div>
    </div>

    <!-- PRAISE OVERLAY -->
    <div id="praise-overlay" class="fixed inset-0 z-[900] flex items-center justify-center pointer-events-none opacity-0">
        <div id="praise-card" class="bg-panelDark border border-accentMint px-20 py-8 rounded-2xl shadow-[0_0_50px_rgba(16,185,129,0.4)] text-center transform scale-50 transition-transform duration-300">
            <h2 id="praise-text" class="font-epic text-6xl font-black uppercase tracking-[0.2em] text-accentMint glow-mint mb-2">BRILLIANT!</h2>
            <p id="praise-sub" class="font-mono text-xs font-bold tracking-[0.4em] uppercase text-textMain">Neural Pathway Formed</p>
        </div>
    </div>

    <!-- TEACHER DRAWER -->
    <div id="teacher-panel" class="teacher-drawer p-8 flex flex-col">
        <div class="flex justify-between items-center mb-8 border-b border-panelHover pb-4">
            <h2 class="font-epic text-3xl text-accentViolet tracking-widest uppercase"><i class="fa-solid fa-microchip mr-3"></i> Core Memory</h2>
            <button onclick="toggleTeacherPanel()" class="text-textMuted hover:text-accentViolet transition-colors"><i class="fa-solid fa-xmark text-3xl"></i></button>
        </div>
        <textarea id="teacher-notes" class="flex-1 bg-bgBase border border-panelHover p-5 font-epic text-xl text-textMain focus:outline-none focus:border-accentViolet resize-none mb-8 rounded-xl" placeholder="> Log student grammar errors and vocabulary here..."></textarea>
        <div class="space-y-4">
            <p class="font-mono text-xs text-textMuted tracking-[0.3em] uppercase text-center font-bold">Professor Commends</p>
            <button onclick="triggerPraise('FLAWLESS SYNTAX!', 'Grammar Validated')" class="w-full py-4 bg-transparent border border-accentMint text-accentMint hover:bg-accentMint hover:text-bgBase transition-all font-epic text-xl tracking-widest uppercase rounded-full shadow-[0_0_10px_rgba(16,185,129,0.2)_inset]">Commend: Grammar</button>
            <button onclick="triggerPraise('HIGH IQ!', 'Vocab Validated')" class="w-full py-4 bg-transparent border border-accentViolet text-accentViolet hover:bg-accentViolet hover:text-bgBase transition-all font-epic text-xl tracking-widest uppercase rounded-full shadow-[0_0_10px_rgba(139,92,246,0.2)_inset]">Commend: Vocab</button>
        </div>
    </div>

    <!-- TOP HUD -->
    <header class="h-24 bg-panelDark border-b border-panelHover z-100 flex items-center justify-between px-8 shrink-0 relative z-40">
        <div class="flex items-center gap-8">
            <div id="health-bar" class="flex gap-3 text-xl text-accentPink">
                <i class="fa-solid fa-heart-pulse" id="hp-1"></i><i class="fa-solid fa-heart-pulse" id="hp-2"></i><i class="fa-solid fa-heart-pulse" id="hp-3"></i>
            </div>
            <div class="flex flex-col border-l border-panelHover pl-6">
                <span class="font-mono text-[9px] text-textMuted uppercase tracking-[0.3em] font-bold">Synaptic Power</span>
                <span id="xp-counter" class="font-epic text-2xl text-accentViolet glow-violet tracking-wider leading-none">0000</span>
            </div>
        </div>
        <div class="absolute left-1/2 -translate-x-1/2 text-center bg-bgBase px-8 py-2 border border-panelHover rounded-b-xl shadow-[0_5px_15px_rgba(139,92,246,0.05)] border-t-0">
            <p id="hud-name" class="font-epic text-2xl text-textMain tracking-[0.2em] uppercase">GUEST_MIND</p>
            <p class="font-mono text-[9px] text-accentMint tracking-widest uppercase mt-1 font-bold">B2 Psychology Module</p>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="toggleFullScreen()" class="w-12 h-12 bg-bgBase border border-panelHover flex items-center justify-center rounded-full text-textMuted hover:border-accentViolet hover:text-accentViolet transition-colors" title="Full Screen"><i class="fa-solid fa-expand text-lg" id="fs-icon"></i></button>
            <button onclick="toggleTeacherPanel()" class="font-epic text-lg text-bgBase bg-accentViolet tracking-[0.2em] uppercase px-6 py-2.5 rounded-full hover:shadow-[0_0_20px_rgba(139,92,246,0.5)] transition-all"><i class="fa-solid fa-network-wired mr-2"></i> Memory</button>
        </div>
    </header>

    <!-- MAIN ARENA -->
    <main id="arena" class="flex-1 relative overflow-y-auto overflow-x-hidden flex items-center justify-center p-4 md:p-8">
        <div id="step-container" class="w-full max-w-5xl transition-all duration-300 relative z-10 h-full flex flex-col justify-center pb-20"></div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <footer class="h-20 bg-panelDark border-t border-panelHover z-100 flex items-center justify-between px-8 shrink-0 relative z-40">
        <div class="w-1/3">
            <div class="w-full bg-bgBase h-1.5 rounded-full overflow-hidden">
                <div id="progress-fill" class="h-full bg-accentViolet transition-all duration-500 shadow-[0_0_10px_rgba(139,92,246,0.8)]" style="width: 4%;"></div>
            </div>
        </div>
        <div class="w-1/3 text-center">
            <span id="page-counter" class="font-epic text-textMuted text-lg tracking-[0.4em] uppercase">NODE 01 / 25</span>
        </div>
        <div class="w-1/3 flex justify-end gap-6">
            <button id="btn-prev" onclick="nav(-1)" class="w-10 h-10 flex items-center justify-center text-textMuted border border-panelHover rounded-full hover:border-accentViolet hover:text-accentViolet disabled:opacity-20 transition-all"><i class="fa-solid fa-chevron-left"></i></button>
            <button id="btn-next" onclick="nav(1)" class="w-10 h-10 flex items-center justify-center text-bgBase bg-accentViolet rounded-full hover:scale-110 shadow-[0_0_15px_rgba(139,92,246,0.4)] disabled:opacity-20 disabled:hover:scale-100 transition-all"><i class="fa-solid fa-chevron-right text-sm"></i></button>
        </div>
    </footer>

    <script>
        // --- STATE MANAGEMENT ---
        let state = { step: 0, hp: 3, xp: 0, studentName: "GUEST_MIND", mechanics: {}, scanStep: 0, brainScores: { Linguistic: 0, Logical: 0, Kinesthetic: 0, Spatial: 0, Interpersonal: 0 } };
        let autoAdvanceTimeout = null; // Navigation Lock Flag

        // UI HELPER: Broadcast Prompt
        const buildSpeakingPrompt = (q, starter) => {
            if(!q) return '';
            return `
                <div class="mt-8 fade-in w-full mx-auto ws-panel border-l-4 border-accentMint p-8 rounded-2xl relative overflow-hidden shadow-2xl">
                    <div class="absolute -right-4 -bottom-4 text-8xl text-bgBase opacity-40"><i class="fa-solid fa-comment-dots"></i></div>
                    <div class="flex items-center gap-3 mb-4 border-b border-panelHover pb-3">
                        <span class="bg-accentMint/20 text-accentMint font-mono text-[10px] font-bold tracking-[0.3em] uppercase px-3 py-1 rounded">PROFESSOR LINK</span>
                    </div>
                    <p class="font-epic text-3xl text-textMain mb-4 relative z-10 leading-snug">"${q}"</p>
                    <p class="font-ui text-textMuted text-sm tracking-widest relative z-10 font-bold border-l-2 border-accentViolet pl-4 italic">"${starter}"</p>
                </div>`;
        };

        // --- EXACT 25 PAGES LESSON DATA ---
        const lesson = [
            /* 00 */ { type: 'cover', title: 'THE MIND PALACE', subtitle: 'Version 2.0 | Advanced Psychology', desc: 'B2 Level. Master Relative Clauses (Defining, Non-Defining, Omission) and Multiple Intelligences.', icon: 'fa-brain' },
            /* 01 */ { type: 'idReg', title: 'ESTABLISH LINK', desc: 'Enter your subject name to connect to the cognitive network.' },
            /* 02 */ { type: 'debate', title: 'THE WARM UP', q: 'Is a person who is amazing at Math smarter than a person who is amazing at Art or Sports?', starter: '"I believe that intelligence is..."' },
            /* 03 */ { type: 'matchVocab', title: 'COGNITIVE GLOSSARY', pairs: [{w:'Proficient', d:'To be very good or skilled at doing something.'}, {w:'Acumen', d:'The ability to make good judgments and quick decisions.'}, {w:'Pursue', d:'To follow or try to achieve a goal or career.'}] },
            /* 04 */ { type: 'videoFeed', title: 'THE 10 INTELLIGENCES (PART 1)', instruction: 'Watch Jim Kwik explain the first 4 types of intelligence.', videoId: 'HIekt2epNgg', start: 0, end: 115 },
            /* 05 */ { type: 'debate', title: 'MID-TAPE DEBATE', q: 'We just saw Linguistic, Logical, Kinesthetic, and Spatial. Which one is the most highly rewarded by our society today?', starter: '"I believe society highly rewards..."' },
            /* 06 */ { type: 'videoFeed', title: 'THE 10 INTELLIGENCES (PART 2)', instruction: 'Watch the remaining types of intelligence.', videoId: 'HIekt2epNgg', start: 115, end: 200 },
            /* 07 */ { type: 'mcqTrial', title: 'COMPREHENSION CHECK', q: 'According to the video, is your intelligence completely fixed like your shoe size?', options: ['Yes, DNA determines everything.', 'No, it can be developed and changed.', 'Yes, unless you read books.'], correct: 1, followUpQ: 'Do traditional schools treat intelligence as fixed or changeable?', starter: '"Traditional schools usually treat it as..."' },
            /* 08 */ { type: 'mcqTrial', title: 'DEEP LISTENING', q: 'Which intelligence involves deep self-awareness and understanding your own mind and emotions?', options: ['Interpersonal', 'Spatial', 'Intrapersonal'], correct: 2 },
            /* 09 */ { type: 'neuralScanner', title: 'THE BRAIN SCANNER', instruction: 'Answer honestly to generate your Intelligence Profile.' },
            /* 10 */ { type: 'neuralProfile', title: 'YOUR NEURAL PROFILE', instruction: 'Here is the breakdown of your dominant intelligences based on the scan.' },
            /* 11 */ { type: 'shift', title: 'SYNTAX OVERRIDE', desc: 'To talk about the different types of people and their intelligences, we must master Relative Clauses. Engage Grammar Module.', bg: 'immersive-shift' },
            /* 12 */ { type: 'lever', title: 'CLAUSES: DEFINING', conceptA: 'No Clause', textA: 'The people are smart.', conceptB: 'Defining Clause', textB: 'The people WHO LOVE MATH are smart.', rule: 'Defining clauses give ESSENTIAL info. No commas. Use Who (people), Which (things), That (both), Where (places).' },
            /* 13 */ { type: 'lever', title: 'CLAUSES: NON-DEFINING', conceptA: 'Defining (Essential)', textA: 'The boy who is running is my brother.', conceptB: 'Non-Defining (Extra)', textB: 'Jim Kwik, who is an author, teaches us.', rule: 'Non-defining clauses give EXTRA info. Use COMMAS. You CANNOT use "that".' },
            /* 14 */ { type: 'decoder', title: 'SYNTAX ASSEMBLY 1', blocks: ['The', 'person', 'I', 'talked', 'to', 'was', 'smart'], correct: 'The person I talked to was smart', followUpQ: 'Wait! What word is missing from this sentence? Why is it missing?', starter: '"The omitted relative pronoun is..."' },
            /* 15 */ { type: 'kanban', title: 'THE CLAUSE SORTER', catA: 'Defining (Essential)', catB: 'Non-Defining (Extra)', items: [{text: 'The book that I read was good.', cat: 'A'}, {text: 'Paris, where I was born, is huge.', cat: 'B'}, {text: 'The student whose phone rang left.', cat: 'A'}, {text: 'My dad, who loves sports, is fit.', cat: 'B'}] },
            /* 16 */ { type: 'lever', title: 'THE OMISSION TRICK', conceptA: 'With Pronoun', textA: 'The book THAT I read was great.', conceptB: 'Omitted (Pro Level)', textB: 'The book I read was great.', rule: 'In Defining clauses, you can DELETE the pronoun (who/which/that) if it is NOT the subject of the next verb.' },
            /* 17 */ { type: 'rapidFire', title: 'REFLEX CHECK', q: 'TRUE OR FALSE? We can use the word "THAT" after a comma in Non-Defining clauses.', instruction: 'Answer out loud before the timer runs out! True or False?' },
            /* 18 */ { type: 'decoder', title: 'SYNTAX ASSEMBLY 2', blocks: ['Leaders', 'are', 'people', 'whose', 'skills', 'are', 'strong'], correct: 'Leaders are people whose skills are strong', followUpQ: 'Who is a leader that you admire?', starter: '"A leader who I admire is..."' },
            /* 19 */ { type: 'qRoulette', title: 'INTELLIGENCE ROULETTE', instruction: 'Spin to answer a question about the mind.', questions: ['Who is the most logically intelligent person you know?', 'Do you have good spatial intelligence (sense of direction)?', 'Is musical intelligence important for society?', 'What intelligence do politicians need most?'] },
            /* 20 */ { type: 'pressConference', title: 'DEFEND YOUR GENIUS', reporter: 'Skeptical Journalist', prompt: 'Defend your dominant intelligence from the Neural Profile.', q: 'You scored high in your dominant Intelligence. Why is this type of intelligence actually useful in the real world?' },
            /* 21 */ { type: 'boardroomPitch', title: 'THE HEADMASTER PITCH', investor: 'Board of Education', prompt: 'Pitch a new school system using Relative Clauses.', q: 'Traditional schools only test math and reading. Pitch us a new system that helps students who have Kinesthetic or Interpersonal intelligence.' },
            /* 22 */ { type: 'crossroads', title: 'THE GENIUS DILEMMA', dilemma: 'You can press a button and instantly become the world\'s greatest Math genius, BUT you will completely lose your Interpersonal (Social) intelligence. Do you press it?', opt1: 'Press the Button', opt2: 'Keep my Brain' },
            /* 23 */ { type: 'homework', title: 'SYNAPSE FORMED', desc: 'Your neural pathways have been upgraded. Download the syntax module to practice Relative Clauses.', appName: 'Mind Palace Homework' },
            /* 24 */ { type: 'curtain', title: 'COGNITIVE MASTER', desc: 'You mastered Relative Clauses (Defining, Non-Defining, Omission) and the theory of Multiple Intelligences!' }
        ];

        // --- CORE FUNCTIONS ---
        function initializeSystem() { document.getElementById('loading-screen').classList.add('fade-out'); loadNotes(); render(); }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
                document.getElementById('fs-icon').classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fs-icon').classList.replace('fa-compress', 'fa-expand');
                }
            }
        }

        function updateHUD() {
            for(let i=1; i<=3; i++) {
                const heart = document.getElementById(`hp-${i}`);
                heart.style.opacity = (i <= state.hp) ? "1" : "0.2";
            }
            document.getElementById('hud-name').innerText = state.studentName;
            document.getElementById('xp-counter').innerText = String(state.xp).padStart(4, '0');
            
            const total = lesson.length;
            document.getElementById('page-counter').innerText = `NODE ${String(state.step + 1).padStart(2, '0')} / ${total}`;
            document.getElementById('progress-fill').style.width = `${((state.step + 1) / total) * 100}%`;
            
            document.getElementById('btn-prev').disabled = state.step === 0;
            document.getElementById('btn-next').disabled = (state.step === total - 1) || (lesson[state.step].type === 'neuralScanner');
            
            if(lesson[state.step].bg === 'immersive-shift') document.body.classList.add('immersive-shift');
            else document.body.classList.remove('immersive-shift');
        }

        // GLOBAL NAVIGATION LOCK: Fixes the double skip bug!
        function nav(dir) { 
            if(autoAdvanceTimeout) {
                clearTimeout(autoAdvanceTimeout);
                autoAdvanceTimeout = null;
            }
            let n = state.step + dir; 
            if(n >= 0 && n < lesson.length) { 
                state.step = n; 
                render(); 
            } 
        }

        function takeDamage() {
            if(state.hp > 0) state.hp--;
            const overlay = document.getElementById('damage-overlay');
            overlay.classList.replace('opacity-0', 'opacity-100');
            document.getElementById('arena').classList.add('damage-shake');
            updateHUD();
            setTimeout(() => { overlay.classList.replace('opacity-100', 'opacity-0'); document.getElementById('arena').classList.remove('damage-shake'); }, 400);
        }

        function triggerPraise(mainText = 'VALIDATED!', subText = 'DATA UPDATED') {
            const overlay = document.getElementById('praise-overlay');
            const card = document.getElementById('praise-card');
            document.getElementById('praise-text').innerText = mainText; document.getElementById('praise-sub').innerText = subText;
            state.xp += 100; updateHUD();
            
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-50'); card.classList.add('scale-100');
            
            shootConfetti();
            
            setTimeout(() => {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                card.classList.remove('scale-100'); card.classList.add('scale-50');
            }, 2000);
        }

        function toggleTeacherPanel() { document.getElementById('teacher-panel').classList.toggle('open'); }

        const notesEl = document.getElementById('teacher-notes');
        function loadNotes() { const saved = localStorage.getItem('wolfNotes_MindPalace2'); if(saved) notesEl.value = saved; }
        notesEl.addEventListener('input', () => { localStorage.setItem('wolfNotes_MindPalace2', notesEl.value); });

        // --- RENDER ENGINE ---
        function render() {
            const container = document.getElementById('step-container');
            const d = lesson[state.step];
            container.innerHTML = ''; updateHUD();
            let content = '';

            switch(d.type) {
                case 'cover':
                    content = `
                        <div class="text-center fade-in flex flex-col items-center">
                            <i class="fa-solid ${d.icon} text-7xl text-accentViolet mb-6 glow-violet"></i>
                            <h1 class="font-epic text-6xl md:text-8xl text-textMain tracking-widest uppercase mb-4">${d.title}</h1>
                            <h2 class="font-epic text-2xl text-accentMint tracking-[0.3em] uppercase mb-8 bg-accentMint/10 px-6 py-2 rounded-full border border-accentMint inline-block glow-mint">${d.subtitle}</h2>
                            <p class="font-ui text-sm text-textMuted max-w-lg mx-auto ws-panel p-6 border-l-4 border-accentViolet rounded-xl leading-relaxed">${d.desc}</p>
                        </div>`;
                    break;
                case 'idReg':
                    content = `
                        <div class="text-center fade-in w-full max-w-xl mx-auto ws-panel p-16 border-t-4 border-accentViolet rounded-3xl">
                            <i class="fa-solid fa-fingerprint text-5xl text-accentViolet mb-6"></i>
                            <h2 class="font-epic text-5xl text-textMain mb-4 tracking-widest uppercase">${d.title}</h2>
                            <p class="font-mono text-textMuted text-xs font-bold mb-10 uppercase tracking-widest">${d.desc}</p>
                            <div class="relative mb-12">

                            <a href="#" class="w-full btn-neuro py-4 rounded-full text-lg inline-block border-accentMint text-accentMint hover:bg-accentMint hover:text-bgBase hover:shadow-[0_0_20px_rgba(16,185,129,0.4)]">LAUNCH ${d.appName}</a>
                        </div>`;
                    break;
                case 'curtain':
                    content = `
                        <div class="w-full max-w-3xl mx-auto fade-in text-center">
                            <div class="inline-block mb-8">
                                <i class="fa-solid fa-brain text-9xl text-accentViolet glow-violet"></i>
                            </div>
                            <h1 class="font-epic text-6xl md:text-8xl text-textMain mb-6 tracking-widest uppercase">${d.title}</h1>
                            <p class="font-ui text-sm text-textMuted font-bold mb-12 uppercase leading-relaxed max-w-xl mx-auto tracking-widest">${d.desc}</p>
                            
                            <div class="bg-bgBase p-8 inline-block min-w-[300px] mb-16 rounded-2xl border border-panelHover shadow-lg">
                                <p class="font-mono text-[10px] text-textMuted mb-2 uppercase font-bold tracking-[0.4em]">Final Synaptic Power</p>
                                <p class="font-epic text-7xl text-accentMint glow-mint">${state.xp}</p>
                            </div>
                            
                            <br>
                            <button onclick="location.reload()" class="font-mono text-textMuted text-xs font-bold hover:text-white transition-colors uppercase tracking-[0.3em]">Disconnect Link</button>
                        </div>`;
                    break;
            }

            container.innerHTML = content;
        }

        // --- SPECIFIC MECHANICS LOGIC ---
        
        function registerID() {
            let val = document.getElementById('id-input').value.trim();
            if(val) {
                state.studentName = val;
                triggerPraise('AUTHENTICATED', 'ACCESS GRANTED');
                autoAdvanceTimeout = setTimeout(() => nav(1), 1500);
            }
        }

        let selectedPill = null;
        function selectVocab(el) {
            if(selectedPill) selectedPill.classList.remove('border-accentViolet', 'text-accentViolet');
            selectedPill = el;
            el.classList.add('border-accentViolet', 'text-accentViolet');
        }
        function dropVocab(slot, correctWord) {
            if(!selectedPill) return;
            if(selectedPill.getAttribute('data-word') === correctWord) {
                slot.innerHTML = `<span class="font-epic text-2xl text-accentViolet tracking-widest uppercase">${correctWord}</span>`;
                slot.classList.replace('border-dashed', 'border-solid');
                slot.classList.replace('border-panelHover', 'border-accentViolet');
                slot.classList.replace('bg-bgBase', 'bg-accentViolet/10');
                selectedPill.style.display = 'none';
                selectedPill = null;
                const total = document.querySelectorAll('.vocab-drop').length;
                const done = document.querySelectorAll('.vocab-drop.border-accentViolet').length;
                if(total === done) triggerPraise('MAPPED!', 'GLOSSARY COMPLETE');
            } else {
                takeDamage();
            }
        }

        function checkMCQ(btn, selectedIndex, correctIndex, hasFollowUp) {
            const container = btn.parentElement;
            Array.from(container.children).forEach(b => b.disabled = true);
            if(selectedIndex === correctIndex) {
                btn.classList.add('border-accentViolet', 'bg-accentViolet/10');
                btn.querySelector('div').classList.add('border-accentViolet', 'bg-accentViolet', 'text-white');
                triggerPraise('CORRECT!', 'COMPREHENSION SOLID');
                if(hasFollowUp) {
                    const fu = document.getElementById('follow-up-box');
                    if(fu) fu.classList.remove('hidden');
                } else {
                    autoAdvanceTimeout = setTimeout(() => { nav(1); }, 2000);
                }
            } else {
                btn.classList.add('border-accentPink', 'bg-accentPink/10');
                btn.querySelector('div').classList.add('border-accentPink', 'bg-accentPink', 'text-white');
                takeDamage();
                container.children[correctIndex].classList.add('border-accentViolet', 'bg-accentViolet/10');
                container.children[correctIndex].querySelector('div').classList.add('border-accentViolet', 'bg-accentViolet', 'text-white');
                autoAdvanceTimeout = setTimeout(() => { nav(1); }, 2500);
            }
        }

        const scanQuestions = [
            { q: "When assembling furniture, do you:", opts: [{t:"Read the manual step-by-step.", type:"Linguistic"}, {t:"Just start building it with your hands.", type:"Kinesthetic"}] },
            { q: "If you have a problem to solve, do you:", opts: [{t:"Create a logical list or flowchart.", type:"Logical"}, {t:"Talk about it with a friend.", type:"Interpersonal"}] },
            { q: "In your free time, do you prefer:", opts: [{t:"Playing a sport or exercising.", type:"Kinesthetic"}, {t:"Reading a book or writing a journal.", type:"Linguistic"}] },
            { q: "When learning something new, do you:", opts: [{t:"Need someone to draw a diagram.", type:"Spatial"}, {t:"Understand better by listening to the logic.", type:"Logical"}] },
            { q: "At a party, are you more likely to:", opts: [{t:"Talk to many different people.", type:"Interpersonal"}, {t:"Observe the architecture and layout of the room.", type:"Spatial"}] }
        ];

        function renderScanStep() {
            const box = document.getElementById('scanner-box');
            if(!box) return;
            
            if(state.scanStep < scanQuestions.length) {
                const sq = scanQuestions[state.scanStep];
                box.innerHTML = `
                    <p class="text-accentMint font-mono font-bold text-[10px] tracking-widest uppercase mb-4 text-center glow-mint">Sequence ${state.scanStep + 1} of ${scanQuestions.length}</p>
                    <h3 class="text-3xl font-ui font-bold text-textMain mb-10 text-center leading-relaxed">"${sq.q}"</h3>
                    <div class="space-y-4">
                        <button onclick="answerScan('${sq.opts[0].type}')" class="w-full p-6 text-left bg-bgBase border border-panelHover rounded-xl text-lg text-textLight hover:border-accentMint hover:text-accentMint transition-all">${sq.opts[0].t}</button>
                        <button onclick="answerScan('${sq.opts[1].type}')" class="w-full p-6 text-left bg-bgBase border border-panelHover rounded-xl text-lg text-textLight hover:border-accentViolet hover:text-accentViolet transition-all">${sq.opts[1].t}</button>
                    </div>
                `;
            } else {
                box.innerHTML = `
                    <div class="text-center">
                        <i class="fa-solid fa-check-circle text-6xl text-accentMint mb-6 glow-mint"></i>
                        <h3 class="text-3xl font-epic font-bold text-textMain mb-2 uppercase tracking-widest">SCAN COMPLETE</h3>
                        <p class="text-textMuted mb-8 font-ui">Neural profile generated successfully.</p>
                        <button onclick="nav(1)" class="btn-neuro px-12 py-3 rounded-full border-accentMint text-accentMint hover:bg-accentMint">VIEW PROFILE</button>
                    </div>
                `;
            }
        }

        function answerScan(type) {
            state.brainScores[type]++;
            state.scanStep++;
            renderScanStep();
        }

        function toggleLever() {
            const track = document.getElementById('grammar-lever');
            state.mechanics.leverState = !state.mechanics.leverState;
            const [ca, ta, cb, tb] = ['lvr-c-a', 'lvr-t-a', 'lvr-c-b', 'lvr-t-b'].map(id => document.getElementById(id));
            if(state.mechanics.leverState) {
                track.classList.add('toggled');
                ca.classList.add('opacity-30'); ta.classList.add('opacity-30');
                cb.classList.remove('opacity-30'); tb.classList.remove('opacity-30');
            } else {
                track.classList.remove('toggled');
                ca.classList.remove('opacity-30'); ta.classList.remove('opacity-30');
                cb.classList.add('opacity-30'); tb.classList.add('opacity-30');
            }
        }

        function moveBlock(btn) {
            const ans = document.getElementById('decoder-ans');
            const bank = document.getElementById('decoder-bank');
            const placeholder = document.getElementById('decoder-placeholder');
            
            if(btn.parentElement === bank) {
                ans.appendChild(btn);
                btn.classList.replace('bg-panelDark', 'bg-transparent');
                if(placeholder) placeholder.style.display = 'none';
            } else {
                bank.appendChild(btn);
                btn.classList.replace('bg-transparent', 'bg-panelDark');
                if(ans.querySelectorAll('button').length === 0 && placeholder) placeholder.style.display = 'block';
            }
        }
        
        function checkDecoder(correctStr, hasFollowUp) {
            const current = Array.from(document.getElementById('decoder-ans').querySelectorAll('button')).map(b => b.innerText).join(' ');
            if(current.toUpperCase() === correctStr.toUpperCase()) {
                document.getElementById('decoder-ans').style.borderColor = '#10B981';
                document.getElementById('decoder-ans').style.boxShadow = 'inset 0 0 20px rgba(16,185,129,0.2)';
                document.getElementById('verify-btn').classList.add('hidden');
                
                if(hasFollowUp) {
                    const fu = document.getElementById('decoder-followup');
                    if(fu) fu.classList.remove('hidden');
                } else {
                    autoAdvanceTimeout = setTimeout(() => { nav(1); }, 2000);
                }
                triggerPraise('SYNTAX ALIGNED', 'SEQUENCE COMPLETE');
            } else {
                takeDamage();
            }
        }

        let selectedMatchItem = null;
        function selectMatchItem(el) {
            if(selectedMatchItem) selectedMatchItem.classList.remove('border-textMain', 'bg-panelHover');
            selectedMatchItem = el;
            el.classList.add('border-textMain', 'bg-panelHover');
        }
        document.addEventListener('click', function(e) {
            const dropArea = e.target.closest('.drop-area');
            if(dropArea && selectedMatchItem) {
                dropArea.appendChild(selectedMatchItem);
                selectedMatchItem.classList.remove('border-textMain', 'bg-panelHover');
                selectedMatchItem.setAttribute('data-currentcat', dropArea.getAttribute('data-cat'));
                selectedMatchItem = null;
            }
        });
        function checkMatchMaker(total) {
            const items = document.querySelectorAll('.match-item');
            let placed = 0; let correct = 0;
            items.forEach(item => {
                if(item.hasAttribute('data-currentcat')) {
                    placed++;
                    if(item.getAttribute('data-currentcat') === item.getAttribute('data-truecat')) correct++;
                }
            });
            if(placed < total) { return; }
            if(correct === total) { 
                triggerPraise('SORTED!', 'LOGIC APPLIED');
                autoAdvanceTimeout = setTimeout(() => nav(1), 1500);
            } else { takeDamage(); }
        }

        function answerLiveStream(btn, answer) {
            if(answer === false) { 
                btn.parentElement.classList.add('hidden');
                triggerPraise('CORRECT!', 'THAT CAN NEVER BE USED AFTER A COMMA');
                autoAdvanceTimeout = setTimeout(() => nav(1), 2000);
            } else {
                takeDamage();
            }
        }

        let rouletteSpinning = false;
        function spinRoulette(stepIndex) {
            if(rouletteSpinning) return;
            rouletteSpinning = true;
            const textEl = document.getElementById('roulette-text'); const btn = document.getElementById('spin-btn'); const fu = document.getElementById('roulette-followup');
            const qList = lesson[stepIndex].questions;
            btn.classList.add('opacity-50', 'pointer-events-none'); fu.classList.add('hidden'); textEl.classList.replace('text-accentMint', 'text-textMuted');
            let spins = 0; const maxSpins = 20;
            const interval = setInterval(() => {
                textEl.innerText = qList[Math.floor(Math.random() * qList.length)]; spins++;
                if(spins >= maxSpins) {
                    clearInterval(interval);
                    textEl.innerText = `"${qList[Math.floor(Math.random() * qList.length)]}"`; textEl.classList.replace('text-textMuted', 'text-accentMint');
                    btn.innerText = "QUERY ANSWERED"; btn.classList.remove('opacity-50', 'pointer-events-none');
                    btn.onclick = () => { fu.classList.remove('hidden'); btn.classList.add('hidden'); triggerPraise('ANALYSIS LOGGED!', 'GOOD WORK'); };
                    rouletteSpinning = false;
                }
            }, 80);
        }

        function togglePressMic() {
            const btn = document.getElementById('mic-btn'); 
            const icon = document.getElementById('mic-icon'); 
            const status = document.getElementById('mic-status');
            
            if(btn.classList.contains('recording')) {
                btn.classList.remove('recording', 'border-accentPink'); 
                btn.classList.add('border-accentMint');
                icon.classList.replace('fa-stop', 'fa-check'); icon.classList.replace('text-accentPink', 'text-accentMint');
                status.innerText = "PITCH RECORDED"; status.classList.replace('text-accentPink', 'text-accentMint');
                triggerPraise('STRONG DEFENSE!', 'BOARD IMPRESSED');
            } else if(!btn.classList.contains('border-accentMint')) {
                btn.classList.add('recording', 'border-accentPink'); btn.classList.remove('border-panelHover');
                icon.classList.replace('fa-microphone', 'fa-stop'); icon.classList.replace('text-textMuted', 'text-accentPink');
                status.innerText = "RECORDING... TAP TO STOP"; status.classList.replace('text-textMuted', 'text-accentPink');
            }
        }

        // --- CONFETTI ENGINE ---
        function shootConfetti() {
            const cCanvas = document.createElement('canvas'); cCanvas.style.position = 'fixed'; cCanvas.style.inset = 0; cCanvas.style.pointerEvents = 'none'; cCanvas.style.zIndex = 9999; document.body.appendChild(cCanvas);
            const cCtx = cCanvas.getContext('2d'); cCanvas.width = window.innerWidth; cCanvas.height = window.innerHeight;
            const pieces = []; const colors = ['#8B5CF6', '#10B981', '#FFFFFF'];
            for(let i=0; i<60; i++) pieces.push({ x: cCanvas.width/2, y: cCanvas.height/2+100, vx: (Math.random()-0.5)*20, vy: (Math.random()-1)*20-5, size: Math.random()*10+5, color: colors[Math.floor(Math.random()*colors.length)], rot: Math.random()*360, rotSpeed: (Math.random()-0.5)*10 });
            function animateC() {
                cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height); let active = false;
                pieces.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.rot += p.rotSpeed; if(p.y < cCanvas.height) active = true; cCtx.save(); cCtx.translate(p.x, p.y); cCtx.rotate(p.rot*Math.PI/180); cCtx.fillStyle = p.color; cCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size); cCtx.restore(); });
                if(active) requestAnimationFrame(animateC); else document.body.removeChild(cCanvas);
            }
            animateC();
        }

        window.onload = () => { updateHUD(); };
    </script>
